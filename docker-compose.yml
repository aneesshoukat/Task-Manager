version: "3.8"

services:
  app:
    build: .
    ports:
      - "8000:80"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localdev.taskmanager.com
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: taskmanager
      DB_USERNAME: taskmanager
      DB_PASSWORD: secret
      JWT_SECRET: change-this-to-a-secure-random-string
    depends_on:
      - db
    volumes:
      - .:/var/www/html

  db:
    image: mysql:8
    environment:
      MYSQL_DATABASE: taskmanager
      MYSQL_USER: taskmanager
      MYSQL_PASSWORD: secret
      MYSQL_ROOT_PASSWORD: rootsecret
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

volumes:
  db_data:
